name: Deploy KDCourses to Ubuntu Server

# Trigger this workflow every time code is pushed to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute SSH Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Stop execution if any command fails
            set -e

            echo "🚀 Starting Deployment Process..."

            # 0. Load NVM explicitly for non-interactive SSH session
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 1. Navigate to the exact project directory on the server
            mkdir -p ~/app/kdcourses/KDCourses
            cd ~/app/kdcourses/KDCourses

            # 2. Pull the latest code from GitHub securely
            echo "📥 Syncing latest code from main branch..."
            if [ ! -d ".git" ]; then
              echo "Initializing Git repository..."
              git init
              git remote add origin https://github.com/shendoo2020/kd_courses.git
            fi
            
            # Fetch and hard reset to ensure exact match with remote
            git fetch --all
            git reset --hard origin/main

            # 3. Deploy Backend
            echo "⚙️ Deploying Backend..."
            cd backend
            npm install
            npx prisma generate
            npx prisma db push
            npm run build
            pm2 restart kdcourses-api --update-env

            # 4. Deploy Frontend
            echo "🎨 Deploying Frontend..."
            cd ../frontend
            npm install
            npm run build
            pm2 restart kdcourses-web --update-env

            # 5. Save PM2 state
            echo "💾 Saving PM2 process state..."
            pm2 save

            echo "✅ Deployment Successful! Platform is LIVE."
